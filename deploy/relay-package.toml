[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sfcloud-ai-relay"
version = "0.1.0"
description = "Controlled Slack to WeCom relay"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-brief-relay = "ai_brief_relay.runtime:main"
ai-brief-notice-check = "ai_brief_relay.notice_check:main"

[tool.setuptools]
packages = ["ai_brief_relay"]
include-package-data = false
