[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sfcloud-ai"
version = "0.1.0"
description = "Local-only, fail-closed prototype for a daily AI infrastructure brief"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
ai-brief = "ai_brief.cli:main"

[tool.setuptools]
packages = ["ai_brief"]
include-package-data = false

[tool.setuptools.package-data]
ai_brief = [
  "resources/config.json",
  "resources/requirements.lock",
  "resources/prompts/*.md",
  "resources/schemas/*.json",
  "resources/fixtures/*.json",
]
