[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sfcloud-ai"
version = "0.1.0"
description = "Local-only, fail-closed prototype for a daily AI infrastructure brief"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
ai-brief = "ai_brief.cli:main"
ai-brief-relay = "ai_brief_relay.runtime:main"
ai-brief-notice-check = "ai_brief_relay.notice_check:main"
ai-brief-notice-socket = "ai_brief_relay.notice_socket:main"
ai-brief-notice-client = "ai_brief_relay.notice_client:main"
ai-brief-control = "ai_brief_control.service:entrypoint"

[tool.setuptools]
packages = ["ai_brief", "ai_brief_relay", "ai_brief_control"]
include-package-data = false

[tool.setuptools.package-dir]
ai_brief_relay = "integrations/slack_wecom"
ai_brief_control = "integrations/slack_control"

[tool.setuptools.package-data]
ai_brief = [
  "resources/config.json",
  "resources/requirements.lock",
  "resources/prompts/*.md",
  "resources/schemas/*.json",
  "resources/fixtures/*.json",
]
